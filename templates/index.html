<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Auto-Fill Form</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #40767a, #4878ba, #bd73a8, #706096);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      font-family: 'Poppins', sans-serif;
      overflow-y: auto;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 2px, transparent 3px);
      background-size: 50px 50px;
      animation: floatParticles 30s linear infinite;
    }

    @keyframes floatParticles {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 30px 35px;
      width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      position: relative;
      z-index: 2;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      font-size: 1.6rem;
    }

    .jump-section { display: none; text-align: center; margin-bottom: 15px; }
    .jump-section select {
      padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.25); color: #121212; outline: none; margin-left: 5px;
    }
    .jump-section button {
      background: linear-gradient(45deg, #8b5cf6, #6366f1);
      padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer;
      color: rgb(215, 208, 208); margin-left: 8px; transition: 0.3s;
    }
    .jump-section button:hover { transform: translateY(-2px); opacity: 0.9; }

    .form-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    label { color: #fff; font-weight: 500; width: 110px; }

    input {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.25); color: #fff; outline: none; transition: 0.3s;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.45);
      border-color: #00eaff;
      box-shadow: 0 0 10px rgba(0, 234, 255, 0.5);
    }

    #pdf {
      margin: 15px 0; background: rgba(255, 255, 255, 0.25); color: #e9e1e1;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px; width: 100%;
    }

    button {
      padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 15px; font-weight: 500; color: white;
      transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }
    button:hover { transform: translateY(-2px); opacity: 0.95; }

    .prev-btn { background: linear-gradient(45deg, #6b7280, #9ca3af); width: 30%; }
    .next-btn { background: linear-gradient(45deg, #facc15, #fbbf24); width: 30%; color: #111; font-weight: 600; }
    .upload-btn { background: linear-gradient(45deg, #3b82f6, #06b6d4); width: 100%; margin-top: 10px; }

    /* ✅ MERGED BUTTON */
    .save-btn {
      background: linear-gradient(45deg, #22c55e, #16a34a);
      width: 100%; margin-top: 8px;
    }

    .buttons-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    #message { text-align: center; margin-top: 15px; font-size: 14px; color: #fff; font-weight: 500; }
  </style>
</head>

<body>

  <div class="container">
    <h2>📄 PDF READER</h2>

    <div class="jump-section" id="jumpSection">
      <label style="color:white;">Select PDF:</label>
      <select id="pdfSelector"></select>
      <button onclick="jumpToSelectedPDF()">Jump</button>
    </div>
    <div class="file-name" id="fileNameDisplay"></div>

    <div class="form-group"><label>Name:</label><input type="text" id="name"></div>
    <div class="form-group"><label>Email:</label><input type="text" id="email"></div>
    <div class="form-group"><label>Phone:</label><input type="text" id="phone"></div>
    <div class="form-group"><label>Company:</label><input type="text" id="company"></div>
    <div class="form-group"><label>State:</label><input type="text" id="state"></div>
    <div class="form-group"><label>District:</label><input type="text" id="district"></div>
    <div class="form-group"><label>Pin Code:</label><input type="text" id="pin"></div>

    <input type="file" id="pdf" multiple accept=".pdf,.zip" />

    <div class="buttons-row">
      <button type="button" class="prev-btn" onclick="prevData()">⬅ Prev</button>
      <button type="button" class="next-btn" onclick="nextData()">Next ➡</button>
    </div>

    <button type="button" class="upload-btn" onclick="uploadPDFs()">Saperate Data</button>

    <!-- ✅ FINAL MERGED BUTTON -->
    <button type="button" class="save-btn" onclick="generateExcelSheet()">
      ✅ Generate Excel Sheet
    </button>

    <p id="message"></p>
  </div>

  <script>
    let allExtractedData = [];
    let currentIndex = 0;

    async function uploadPDFs() {
      const fileInput = document.getElementById('pdf');
      const message = document.getElementById('message');
      const jumpSection = document.getElementById('jumpSection');
      const pdfSelector = document.getElementById('pdfSelector');
      message.textContent = '';
      allExtractedData = [];
      currentIndex = 0;

      if (!fileInput.files.length) { alert('Select at least one PDF or ZIP'); return; }

      message.textContent = 'Processing... Please wait ⏳';

      const formData = new FormData();
      for (let file of fileInput.files) formData.append('pdf', file);

      const response = await fetch('/upload', { method: 'POST', body: formData });
      const result = await response.json();

      if (result.error) { alert(result.error); }
      else if (result.autofill && result.autofill.length > 0) {
        allExtractedData = result.autofill;
        message.textContent = `Extracted ${allExtractedData.length} record(s) ✅`;
        fillForm(allExtractedData[0]);

        pdfSelector.innerHTML = '';
        allExtractedData.forEach((data, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = data.filename;
          pdfSelector.appendChild(opt);
        });
        jumpSection.style.display = 'block';
      } else {
        message.textContent = 'No data found in PDFs!';
      }
    }

    function fillForm(data) {
      document.getElementById('fileNameDisplay').innerText = `📁 ${data.filename}`;
      document.getElementById('name').value = data.name || '';
      document.getElementById('email').value = data.email || '';
      document.getElementById('phone').value = data.phone || '';
      document.getElementById('company').value = data.company || '';
      document.getElementById('state').value = data.state || '';
      document.getElementById('district').value = data.district || '';
      document.getElementById('pin').value = data.pin || '';
    }

    function nextData() {
      if (currentIndex < allExtractedData.length - 1) {
        saveCurrent();
        currentIndex++;
        fillForm(allExtractedData[currentIndex]);
        document.getElementById('pdfSelector').value = currentIndex;
      }
    }

    function prevData() {
      if (currentIndex > 0) {
        saveCurrent();
        currentIndex--;
        fillForm(allExtractedData[currentIndex]);
        document.getElementById('pdfSelector').value = currentIndex;
      }
    }

    function jumpToSelectedPDF() {
      const selected = parseInt(document.getElementById('pdfSelector').value);
      if (!isNaN(selected)) {
        saveCurrent();
        currentIndex = selected;
        fillForm(allExtractedData[currentIndex]);
      }
    }

    function saveCurrent() {
      const curr = allExtractedData[currentIndex];
      curr.name = document.getElementById('name').value;
      curr.email = document.getElementById('email').value;
      curr.phone = document.getElementById('phone').value;
      curr.company = document.getElementById('company').value;
      curr.state = document.getElementById('state').value;
      curr.district = document.getElementById('district').value;
      curr.pin = document.getElementById('pin').value;
    }

    async function saveData() {
      saveCurrent();
      const message = document.getElementById('message');
      message.textContent = 'Saving to database... ⏳';
      const response = await fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(allExtractedData)
      });
      const result = await response.json();
      message.textContent = result.message;
    }

    async function generateExcelSheet() {
      await saveData();                 // ✅ Step 1: Save first
      window.location.href = '/download_excel'; // ✅ Step 2: Download directly
    }
  </script>
</body>
</html>
